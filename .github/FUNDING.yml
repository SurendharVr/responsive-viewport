# Renders the "Sponsor" button on this repository.
# The github: key only takes effect once a GitHub Sponsors profile exists at
# https://github.com/sponsors/SurendharVr - until then GitHub ignores it and
# no button appears, which is harmless.
github: [SurendharVr]

# Other platforms, if you ever add them. Uncomment and fill in the handle;
# leaving a key present but empty is a YAML error, so delete rather than blank.
# ko_fi: your-handle
# buy_me_a_coffee: your-handle
# custom: ["https://example.com/donate"]
